<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Play • CHRISCO Bible Quizzes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2346178f'/><path d='M28 12h8v14h14v8H36v18h-8V34H14v-8h14z' fill='%23ffd76e'/></svg>" />
  <style>
    :root {
      --red: #e21b3c;
      --blue: #1368ce;
      --yellow: #d89e00;
      --green: #26890c;
      --purple: #46178f;
      --panel: #36225c;
      --gold: #ffd76e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: ui-rounded, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #24074a;
      color: #fff;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }
    /* Phone-shaped column, full-bleed on actual phones */
    .app {
      max-width: 540px;
      margin: 0 auto;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(700px 500px at 50% -10%, #6a2ec9 0%, var(--purple) 55%, #2b0b4a 100%);
      position: relative;
      overflow: hidden;
    }

    .screen {
      display: none;
      flex: 1;
      flex-direction: column;
      padding: 20px;
      min-height: 0;
    }
    .screen.active { display: flex; }

    .brand {
      text-align: center;
      font-weight: 900;
      font-size: 1.05rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--gold);
      padding-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .45em;
    }
    .brand svg { width: 1.15em; height: 1.15em; flex: none; }
    .brand .brand-text { display: flex; flex-direction: column; align-items: center; }
    .brand small { color: #fff; opacity: .75; font-size: .72rem; letter-spacing: .25em; margin-top: 3px; }

    /* ---------------- LOGIN ---------------- */
    #login { justify-content: center; gap: 22px; text-align: center; }
    .logo-big {
      font-size: clamp(3.4rem, 18vw, 5rem);
      line-height: 1;
      color: var(--gold);
      display: grid;
      place-items: center;
    }
    .logo-big svg { width: 1em; height: 1em; stroke-width: 2.2; filter: drop-shadow(0 8px 24px rgba(255, 215, 110, .4)); }
    .title-big { font-size: clamp(1.7rem, 8vw, 2.4rem); font-weight: 900; letter-spacing: 1px; }
    .title-big span { color: var(--gold); display: block; font-size: .6em; letter-spacing: .3em; text-transform: uppercase; margin-top: 6px; }
    .card {
      background: rgba(0, 0, 0, .32);
      border: 3px solid rgba(255, 255, 255, .18);
      border-radius: 22px;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: left;
    }
    .field label {
      display: block;
      font-size: .8rem;
      font-weight: 900;
      letter-spacing: .18em;
      text-transform: uppercase;
      opacity: .8;
      margin-bottom: 8px;
    }
    .field input {
      width: 100%;
      font-family: inherit;
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
      background: rgba(0, 0, 0, .4);
      border: 3px solid rgba(255, 255, 255, .25);
      border-radius: 14px;
      padding: .9em 1em;
      outline: none;
      transition: border-color .15s;
    }
    .field input:focus { border-color: var(--gold); }
    #pin {
      text-align: center;
      font-size: 2rem;
      letter-spacing: .45em;
      text-indent: .45em; /* offset letter-spacing so digits stay centred */
    }
    .btn-join {
      font-family: inherit;
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: #fff;
      background: linear-gradient(160deg, #22a113, var(--green));
      border: none;
      border-radius: 16px;
      padding: 1em;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(0, 0, 0, .35);
      transition: transform .1s;
    }
    .btn-join:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
    .err {
      color: #ffb3bd;
      font-weight: 800;
      font-size: .95rem;
      text-align: center;
      min-height: 1.3em;
    }

    /* ---------------- WAITING ---------------- */
    #waiting { align-items: center; justify-content: center; text-align: center; gap: 18px; }
    .big-check {
      width: clamp(96px, 30vw, 140px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--green);
      display: grid;
      place-items: center;
      color: #fff;
      box-shadow: 0 10px 40px rgba(38, 137, 12, .55);
      animation: pop .4s cubic-bezier(.2, 1.6, .4, 1);
    }
    .big-check svg { width: 55%; height: 55%; stroke-width: 3; }
    @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
    .wait-title { font-size: clamp(1.8rem, 8vw, 2.6rem); font-weight: 900; }
    .wait-sub { font-size: clamp(1rem, 4vw, 1.2rem); font-weight: 700; opacity: .85; line-height: 1.5; }
    .name-pill {
      background: #fff;
      color: var(--purple);
      font-weight: 900;
      padding: .5em 1.3em;
      border-radius: 999px;
      font-size: 1.1rem;
    }
    .score-pill {
      background: rgba(0, 0, 0, .35);
      border: 2px solid var(--gold);
      color: var(--gold);
      font-weight: 900;
      padding: .5em 1.3em;
      border-radius: 999px;
      font-size: 1.05rem;
      display: inline-flex;
      align-items: center;
      gap: .4em;
    }
    .score-pill svg { width: 1em; height: 1em; }
    .dots::after {
      content: '';
      animation: dots 1.4s steps(4, end) infinite;
    }
    @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

    /* ---------------- QUESTION / ANSWER ---------------- */
    #quiz { padding: 14px 14px 18px; gap: 12px; }
    .q-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .mini-pill {
      background: rgba(0, 0, 0, .35);
      border: 2px solid rgba(255, 255, 255, .3);
      border-radius: 999px;
      font-weight: 900;
      font-size: .9rem;
      padding: .4em 1em;
    }
    .seconds { font-size: 1.5rem; font-weight: 900; color: var(--gold); min-width: 2ch; text-align: right; }
    .tbar { height: 10px; background: rgba(255, 255, 255, .18); border-radius: 99px; overflow: hidden; }
    .tbar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ffd76e, #ff9f1a); border-radius: 99px; }
    .pq {
      background: rgba(0, 0, 0, .32);
      border: 3px solid rgba(255, 255, 255, .16);
      border-radius: 18px;
      padding: 16px 14px;
      font-size: clamp(1.15rem, 5.4vw, 1.55rem);
      font-weight: 900;
      text-align: center;
      line-height: 1.35;
    }
    .pad {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 12px;
      min-height: 0;
    }
    .key {
      border: none;
      border-radius: 18px;
      display: grid;
      place-items: center;
      cursor: pointer;
      min-height: clamp(110px, 24vh, 200px);
      box-shadow: inset 0 -9px 0 rgba(0, 0, 0, .3);
      transition: transform .08s, opacity .2s;
      padding: 10px;
    }
    .key:active { transform: scale(.96); }
    .key:disabled { cursor: default; opacity: .55; }
    .key.red { background: var(--red); }
    .key.blue { background: var(--blue); }
    .key.yellow { background: var(--yellow); }
    .key.green { background: var(--green); }
    .shape { width: clamp(46px, 14vw, 74px); height: clamp(46px, 14vw, 74px); background: #fff; }
    .shape.triangle { clip-path: polygon(50% 0, 0 100%, 100% 100%); }
    .shape.diamond { transform: rotate(45deg); border-radius: 8px; }
    .shape.circle { border-radius: 50%; }
    .shape.square { border-radius: 8px; }

    /* Locked-in state */
    #locked { align-items: center; justify-content: center; text-align: center; gap: 20px; }
    .locked-shape { width: clamp(110px, 38vw, 170px); height: clamp(110px, 38vw, 170px); background: #fff; opacity: .9; animation: pop .3s; }
    .locked-title { font-size: clamp(1.7rem, 7vw, 2.4rem); font-weight: 900; }
    .locked-sub { font-size: 1.05rem; font-weight: 700; opacity: .85; }

    /* ---------------- RESULT ---------------- */
    #result { align-items: center; justify-content: center; text-align: center; gap: 14px; }
    #result.right { background: linear-gradient(180deg, #1f9c0f 0%, #146308 100%); }
    #result.wrong { background: linear-gradient(180deg, #d01634 0%, #8f0d24 100%); }
    .verdict { font-size: clamp(3.4rem, 20vw, 6rem); font-weight: 900; line-height: 1; animation: pop .35s cubic-bezier(.2, 1.6, .4, 1); }
    .verdict svg { width: 1em; height: 1em; stroke-width: 3; }
    .verdict-text { font-size: clamp(1.6rem, 8vw, 2.4rem); font-weight: 900; letter-spacing: 1px; }
    .pts-earned {
      background: rgba(0, 0, 0, .3);
      border: 3px solid var(--gold);
      color: var(--gold);
      font-size: clamp(1.5rem, 7vw, 2.2rem);
      font-weight: 900;
      padding: .45em 1.1em;
      border-radius: 16px;
    }
    .total-line { font-size: 1.15rem; font-weight: 800; opacity: .95; display: inline-flex; align-items: center; gap: .4em; }
    .total-line svg { width: 1em; height: 1em; color: var(--gold); }
    .rank-line { font-size: 1rem; font-weight: 800; opacity: .85; }
    .answer-reveal { font-size: 1.05rem; font-weight: 800; opacity: .95; background: rgba(0,0,0,.25); padding:.5em 1em; border-radius:12px; }

    /* ---------------- OVERLAYS ---------------- */
    .overlay {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 40;
      background: #2b0b4a;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
      padding: 30px;
    }
    .overlay.show { display: flex; }
    .overlay .icon { color: #ffb3bd; line-height: 0; }
    .overlay .icon svg { width: clamp(3rem, 14vw, 4.5rem); height: clamp(3rem, 14vw, 4.5rem); stroke-width: 2.2; }
    .overlay h2 { font-size: 1.6rem; font-weight: 900; }
    .overlay p { font-weight: 700; opacity: .85; line-height: 1.5; }
    .overlay button {
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 900;
      color: #fff;
      background: var(--blue);
      border: none;
      border-radius: 14px;
      padding: .8em 1.8em;
      cursor: pointer;
      box-shadow: 0 5px 0 rgba(0,0,0,.35);
    }

    .toast {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(-90px);
      background: #111;
      border: 2px solid var(--red);
      color: #fff;
      font-weight: 800;
      font-size: .95rem;
      padding: .65em 1.2em;
      border-radius: 12px;
      opacity: 0;
      transition: .3s;
      z-index: 60;
      max-width: 90%;
      text-align: center;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <div class="brand"><i data-lucide="cross"></i><span class="brand-text">CHRISCO<small>Bible Quizzes</small></span></div>

    <!-- ============ LOGIN ============ -->
    <section class="screen active" id="login">
      <div class="logo-big"><i data-lucide="gamepad-2"></i></div>
      <div class="title-big">Let’s Play!<span>Bible Quizzes</span></div>
      <form class="card" id="join-form" autocomplete="off">
        <div class="field">
          <label for="pin">Game PIN</label>
          <input id="pin" name="pin" type="text" inputmode="numeric" pattern="[0-9]*"
                 maxlength="4" placeholder="••••" autocomplete="off" />
        </div>
        <div class="field">
          <label for="name">Nickname</label>
          <input id="name" name="name" type="text" maxlength="16"
                 placeholder="e.g. Faith" autocomplete="off" />
        </div>
        <button class="btn-join" type="submit">JOIN GAME</button>
        <div class="err" id="login-err"></div>
      </form>
    </section>

    <!-- ============ WAITING ============ -->
    <section class="screen" id="waiting">
      <div class="big-check" id="wait-icon"><i data-lucide="check"></i></div>
      <div class="wait-title" id="wait-title">You’re in!</div>
      <div class="wait-sub" id="wait-sub">Look at the big screen…</div>
      <div class="name-pill" id="wait-name" style="display:none;"></div>
      <div class="score-pill" id="wait-score" style="display:none;"></div>
    </section>

    <!-- ============ QUESTION / ANSWER ============ -->
    <section class="screen" id="quiz">
      <div class="q-meta">
        <span class="mini-pill" id="q-count">Q1 of 5</span>
        <span class="seconds" id="seconds">15</span>
      </div>
      <div class="tbar"><i id="tbar-fill"></i></div>
      <div class="pq" id="pq">Question…</div>
      <div class="pad" id="pad">
        <button class="key red"    data-i="0"><span class="shape triangle"></span></button>
        <button class="key blue"   data-i="1"><span class="shape diamond"></span></button>
        <button class="key yellow" data-i="2"><span class="shape circle"></span></button>
        <button class="key green"  data-i="3"><span class="shape square"></span></button>
      </div>
    </section>

    <!-- ============ LOCKED (answered, waiting for reveal) ============ -->
    <section class="screen" id="locked">
      <div class="locked-shape" id="locked-shape"></div>
      <div class="locked-title">Answer locked in!</div>
      <div class="locked-sub">Waiting for the big screen<span class="dots"></span></div>
    </section>

    <!-- ============ RESULT ============ -->
    <section class="screen" id="result">
      <div class="verdict" id="verdict"><i data-lucide="check"></i></div>
      <div class="verdict-text" id="verdict-text">Correct!</div>
      <div class="pts-earned" id="pts-earned">+0 points</div>
      <div class="total-line" id="total-line"><i data-lucide="star"></i> Total: 0</div>
      <div class="rank-line" id="rank-line"></div>
      <div class="answer-reveal" id="answer-reveal"></div>
    </section>

    <!-- ============ HOST LEFT OVERLAY ============ -->
    <div class="overlay" id="host-left">
      <div class="icon"><i data-lucide="wifi-off"></i></div>
      <h2>The host left the game</h2>
      <p>Ask the leader to start a new game, then join again with the new PIN.</p>
      <button onclick="location.reload()">BACK TO LOGIN</button>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script src="/vendor/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script>
    if (!window.supabase) document.write('<script src="/vendor/supabase.js"><\/script>');
    /* ============================================================
       CHRISCO PLAYER — Supabase Realtime (Broadcast + Presence)
       - Postgres validates the PIN and stores the roster/score
       - Broadcast carries live questions, answers and reveals
       - Presence tells us when the host disconnects
       ============================================================ */
    const $ = (id) => document.getElementById(id);
    const fmt = (n) => Number(n).toLocaleString();
    const icons = () => window.lucide && lucide.createIcons({ attrs: { 'stroke-width': 2.4 } });
    icons();

    // Persistent token lets a player rejoin after a Wi-Fi blip
    // without losing their score.
    let token = localStorage.getItem('chrisco_token');
    if (!token) {
      token = 't-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
      localStorage.setItem('chrisco_token', token);
    }

    let sb = null;
    let channel = null;
    let joined = false;
    let lastPin = '';
    let myName = '';
    let myScore = 0;
    let timerId = null;
    let screen = 'login';

    const SHAPES = ['triangle', 'diamond', 'circle', 'square'];

    const sbReady = (async () => {
      const cfg = await fetch('/api/config').then((r) => r.json());
      if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
        throw new Error('missing config');
      }
      sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
      return sb;
    })();

    function show(id) {
      screen = id;
      document.querySelectorAll('.screen').forEach((el) => {
        el.classList.toggle('active', el.id === id);
      });
    }

    function toast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => t.classList.remove('show'), 2600);
    }

    function setWaiting(title, sub, { icon = 'check', showName = true, showScore = false } = {}) {
      $('wait-icon').innerHTML = `<i data-lucide="${icon}"></i>`;
      $('wait-title').textContent = title;
      $('wait-sub').textContent = sub;
      const namePill = $('wait-name');
      namePill.style.display = showName && myName ? '' : 'none';
      namePill.textContent = myName;
      const scorePill = $('wait-score');
      scorePill.style.display = showScore ? '' : 'none';
      scorePill.innerHTML = `<i data-lucide="star"></i> ${fmt(myScore)} pts`;
      show('waiting');
      icons();
    }

    // ---------- Login ----------
    $('join-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pin = $('pin').value.trim();
      const name = $('name').value.trim();
      $('login-err').textContent = '';
      if (!/^\d{4}$/.test(pin)) {
        $('login-err').textContent = 'Enter the 4-digit PIN from the big screen.';
        return;
      }
      if (!name) {
        $('login-err').textContent = 'Please enter your nickname.';
        return;
      }

      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
        await sbReady;

        // 1) Validate the PIN against Postgres.
        const { data: room, error: roomErr } = await sb
          .from('rooms')
          .select('pin,status')
          .eq('pin', pin)
          .maybeSingle();
        if (roomErr) throw roomErr;
        if (!room) {
          $('login-err').textContent = 'Game not found. Check the PIN.';
          return;
        }

        // 2) Existing row? (rejoin keeps the score) — else only lobby joins allowed.
        const { data: existing, error: exErr } = await sb
          .from('players')
          .select('id,score')
          .eq('room_pin', pin)
          .eq('token', token)
          .maybeSingle();
        if (exErr) throw exErr;

        if (existing) {
          await sb.from('players').update({ name }).eq('id', existing.id);
          myScore = existing.score || 0;
        } else {
          if (room.status !== 'lobby') {
            $('login-err').textContent = 'This game has already started.';
            return;
          }
          const { error: insErr } = await sb
            .from('players')
            .insert({ room_pin: pin, token, name });
          if (insErr) {
            // Unique violation = concurrent rejoin; treat as rejoin.
            if (insErr.code !== '23505') throw insErr;
          }
          myScore = 0;
        }

        // 3) Join the Realtime channel for this room.
        joined = true;
        lastPin = pin;
        myName = name;
        await joinChannel(pin);
        setWaiting('You’re in!', 'Look at the big screen — the game will start soon.');
      } catch (err) {
        console.error(err);
        $('login-err').textContent = 'Could not join — check your connection and try again.';
      } finally {
        btn.disabled = false;
      }
    });

    // Auto-advance PIN field to nickname
    $('pin').addEventListener('input', () => {
      $('pin').value = $('pin').value.replace(/\D/g, '').slice(0, 4);
      if ($('pin').value.length === 4) $('name').focus();
    });

    async function joinChannel(pin) {
      if (channel) {
        await sb.removeChannel(channel);
        channel = null;
      }

      channel = sb.channel(`room:${pin}`, {
        config: { broadcast: { self: false }, presence: { key: token } },
      });

      channel
        .on('broadcast', { event: 'question' }, ({ payload }) => onQuestion(payload))
        .on('broadcast', { event: 'reveal' }, ({ payload }) => onReveal(payload))
        .on('broadcast', { event: 'final' }, ({ payload }) => onFinal(payload))
        .on('broadcast', { event: 'answer_error' }, ({ payload }) => onAnswerError(payload))
        .on('presence', { event: 'sync' }, checkHost);

      // Re-subscribes after network blips: re-track + re-sync state.
      channel.subscribe((status) => {
        if (status === 'SUBSCRIBED') {
          channel.track({ role: 'player', name: myName, token });
          requestSync();
        } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
          toast('Connection lost — retrying…');
        }
      });
    }

    async function requestSync() {
      if (!sb || !lastPin) return;
      try {
        const { data: room } = await sb.from('rooms').select('status').eq('pin', lastPin).maybeSingle();
        if (!room) return;
        if (room.status === 'lobby') {
          setWaiting('You’re in!', 'Look at the big screen — the game will start soon.');
        } else if (room.status === 'finished') {
          setWaiting('Game over!', 'Thanks for playing — ask the host for the results!', {
            icon: 'flag',
            showScore: true,
          });
        } else if (channel) {
          // question or results → ask the host to replay current state for me
          channel.send({ type: 'broadcast', event: 'sync_request', payload: { token } });
        }
      } catch (err) {
        console.error(err);
      }
    }

    function checkHost() {
      if (!joined || !channel) return;
      const st = channel.presenceState();
      let hasHost = false;
      for (const metas of Object.values(st)) {
        if (metas.some((m) => m && m.role === 'host')) {
          hasHost = true;
          break;
        }
      }
      $('host-left').classList.toggle('show', !hasHost);
    }

    // ---------- New question ----------
    window.__lastResults = null;
    window.__pendingResult = null;
    window.__lastQuestion = null;

    function onQuestion(q) {
      if (q.forToken && q.forToken !== token) return;
      window.__lastResults = null;
      window.__pendingResult = null;
      window.__lastQuestion = q;
      renderQuestion(q, q.msLeft != null ? q.msLeft : q.durationMs);
    }

    function renderQuestion(q, msLeft) {
      stopTimer();
      clearTimeout(renderResult._t); // don't let the result screen steal the new question
      $('q-count').textContent = `Q${q.questionNumber} of ${q.totalQuestions}`;
      $('pq').textContent = q.question;
      document.querySelectorAll('#pad .key').forEach((b) => {
        b.disabled = false;
        b.style.opacity = '';
      });
      show('quiz');
      startTimer(msLeft || q.durationMs);
      if (navigator.vibrate) navigator.vibrate(40);
    }

    function startTimer(ms) {
      const endsAt = Date.now() + ms;
      const fill = $('tbar-fill');
      const secs = $('seconds');
      const tick = () => {
        const left = Math.max(0, endsAt - Date.now());
        secs.textContent = Math.ceil(left / 1000);
        fill.style.width = (left / ms) * 100 + '%';
        if (left <= 0) stopTimer();
      };
      tick();
      timerId = setInterval(tick, 100);
    }

    function stopTimer() {
      if (timerId) clearInterval(timerId);
      timerId = null;
    }

    // ---------- Submit answer (optimistic lock + host validation) ----------
    document.querySelectorAll('#pad .key').forEach((btn) => {
      btn.addEventListener('click', () => {
        const index = Number(btn.dataset.i);
        if (!channel || screen !== 'quiz') return;
        // Lock immediately for snappy feel; host rejects (rare) via answer_error.
        lockIn(index);
        channel.send({ type: 'broadcast', event: 'answer', payload: { token, answerIndex: index } });
      });
    });

    function lockIn(index) {
      stopTimer();
      document.querySelectorAll('#pad .key').forEach((b) => (b.disabled = true));
      const shape = $('locked-shape');
      shape.className = 'locked-shape shape ' + SHAPES[index];
      show('locked');
      if (navigator.vibrate) navigator.vibrate(30);
    }

    function onAnswerError({ token: from, error }) {
      if (from !== token) return;
      toast(error);
      if (screen !== 'locked') return;
      // Duplicates / late taps: stay locked — the reveal is coming anyway.
      if (error === 'You already answered this question.' || error === 'Time is up!') return;
      // Rejected because the question ended: show the interstitial.
      if (error === 'There is no active question.') {
        setWaiting('Get ready!', 'Next question coming up…', { icon: 'hourglass', showScore: true });
        return;
      }
      // Anything else (e.g. not in game): restore the pad if we have the question.
      if (window.__lastQuestion) {
        renderQuestion(window.__lastQuestion, window.__lastQuestion.durationMs);
      }
    }

    // ---------- Reveal ----------
    // The host broadcasts one `reveal` containing every player's result;
    // each client picks out its own entry by token.
    function onReveal(r) {
      if (r.forToken && r.forToken !== token) return;
      const mine = r.results && r.results[token];
      if (mine) window.__pendingResult = mine;
      window.__lastResults = r;
      maybeRenderResult();
    }

    function maybeRenderResult() {
      if (window.__pendingResult && window.__lastResults) {
        const r = window.__pendingResult;
        const results = window.__lastResults;
        window.__pendingResult = null;
        renderResult(r, results);
      }
    }

    function renderResult(r, results) {
      if (!r || !results) return;
      stopTimer();
      myScore = r.score;
      const ok = r.correct;
      const el = $('result');
      el.classList.toggle('right', ok);
      el.classList.toggle('wrong', !ok);
      $('verdict').innerHTML = ok ? '<i data-lucide="check"></i>' : '<i data-lucide="x"></i>';
      $('verdict-text').textContent = ok ? 'Correct!' : 'Wrong!';
      $('pts-earned').textContent = r.answered ? '+' + fmt(r.points) + ' points' : 'No answer';
      $('total-line').innerHTML = `<i data-lucide="star"></i> Total: ${fmt(r.score)} pts`;
      $('rank-line').textContent = r.rank ? `You’re #${r.rank} on the scoreboard` : '';
      $('answer-reveal').textContent = 'Answer: ' + results.correctText;
      show('result');
      icons();
      if (navigator.vibrate) navigator.vibrate(ok ? [60, 40, 60] : 200);
      // Hold the result, then show a waiting screen for the next question.
      clearTimeout(renderResult._t);
      renderResult._t = setTimeout(() => {
        setWaiting('Get ready!', 'Next question coming up…', { icon: 'hourglass', showScore: true });
      }, 3200);
    }

    // ---------- Final ----------
    function onFinal(f) {
      if (f.forToken && f.forToken !== token) return;
      setWaiting('Game over!', 'Thanks for playing — ask the host for the results!', {
        icon: 'flag',
        showScore: true,
      });
    }

    // ---------- Config errors ----------
    sbReady.catch(() => toast('Server config missing (SUPABASE_URL / SUPABASE_ANON_KEY).'));
  </script>
</body>
</html>
